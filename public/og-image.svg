<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0c"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#1a1a1f" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Pendulum icon -->
  <g transform="translate(600, 180)">
    <!-- String -->
    <line x1="0" y1="-80" x2="0" y2="30" stroke="#c9a962" stroke-width="3"/>
    <!-- Weight -->
    <circle cx="0" cy="50" r="20" fill="#c9a962"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" fill="#f5f5f5" font-family="Georgia, serif" font-size="72" letter-spacing="0.2em">PENDULUM</text>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" fill="#8a8a8e" font-family="system-ui, sans-serif" font-size="24" letter-spacing="0.15em">PERSONAL MYTH ENGINE</text>
  
  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" fill="#a0a0a5" font-family="Georgia, serif" font-size="28" font-style="italic">Your externalized intuition</text>
  
  <!-- Bottom line -->
  <text x="600" y="540" text-anchor="middle" fill="#6a6a6e" font-family="system-ui, sans-serif" font-size="18">No tracking. No streaks. Just presence.</text>
</svg>
