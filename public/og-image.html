<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #0a0a0c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
    }
    .pendulum {
      margin-bottom: 40px;
    }
    .line {
      width: 3px;
      height: 80px;
      background: #c9a962;
      margin: 0 auto;
    }
    .weight {
      width: 40px;
      height: 40px;
      background: #c9a962;
      border-radius: 50%;
      margin: 0 auto;
      margin-top: -5px;
    }
    h1 {
      color: #f5f5f5;
      font-size: 72px;
      letter-spacing: 0.2em;
      margin: 20px 0;
      font-weight: normal;
    }
    .subtitle {
      color: #8a8a8e;
      font-size: 24px;
      letter-spacing: 0.15em;
      font-family: system-ui, sans-serif;
      margin-bottom: 60px;
    }
    .tagline {
      color: #a0a0a5;
      font-size: 28px;
      font-style: italic;
      margin-bottom: 20px;
    }
    .bottom {
      color: #6a6a6e;
      font-size: 18px;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="pendulum">
    <div class="line"></div>
    <div class="weight"></div>
  </div>
  <h1>PENDULUM</h1>
  <div class="subtitle">PERSONAL MYTH ENGINE</div>
  <div class="tagline">Your externalized intuition</div>
  <div class="bottom">No tracking. No streaks. Just presence.</div>
</body>
</html>
